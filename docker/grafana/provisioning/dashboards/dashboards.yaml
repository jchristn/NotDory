apiVersion: 1

# Load all NotDory dashboards directly into a single top-level "NotDory" folder (no subfolders).
# foldersFromFilesStructure is off, so every dashboard under the mounted path lands in the `folder` below.
providers:
  - name: 'NotDory'
    orgId: 1
    folder: 'NotDory'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards/notdory
      foldersFromFilesStructure: false
